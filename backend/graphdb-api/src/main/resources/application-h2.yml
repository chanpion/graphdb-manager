# H2 数据库配置（默认）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:graphdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    # 切换为文件存储（可选）
    # url: jdbc:h2:file:./data/graphdb;MODE=MySQL;DB_CLOSE_DELAY=-1
  
  # H2 控制台
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # SQL 初始化配置 - 使用 H2 专用 SQL 文件
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
